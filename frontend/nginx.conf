# Раздача собранного SPA + проксирование /api на backend-контейнер.
# Имя хоста "backend" — сервис из docker-compose.yml (Docker DNS в общей сети).

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Статика с длинным кэшем (Vite добавляет хэш в имена файлов из dist/assets).
  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location /api/ {
    proxy_pass http://backend:4000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SPA fallback — весь остальной трафик отдаём в index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
